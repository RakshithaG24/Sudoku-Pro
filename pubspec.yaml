name: sudoku_game
description: A production-quality Sudoku game for Flutter Web
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # Local Storage (Web-compatible)
  shared_preferences: ^2.2.2
  
  # Animations
  animate_do: ^3.3.4
  confetti: ^0.7.0
  
  # Audio
  audioplayers: ^5.2.1
  
  # Icons & UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  
  # Utilities
  collection: ^1.18.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/sounds/
    - assets/images/
  
